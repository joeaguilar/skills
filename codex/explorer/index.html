<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Primitive Tree</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="unlockLayer" class="unlock-layer" aria-live="polite" aria-atomic="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark"><img src="./assets/codex-sigil.svg" alt="" aria-hidden="true"></div>
          <div>
            <h1>Codex Primitive Tree</h1>
            <p id="projectPath">Project primitives: .codex/project-primitives.json</p>
          </div>
        </div>
        <div class="status-strip" aria-label="Primitive tree status">
          <div><strong id="enabledCount">0</strong><span>Enabled</span></div>
          <div><strong id="availableCount">0</strong><span>Available</span></div>
          <div><strong id="capabilityCount">0</strong><span>Capabilities</span></div>
        </div>
        <div id="scopeControl" class="scope-control" role="group" aria-label="Manifest scope">
          <button type="button" data-scope="local">Local</button>
          <button type="button" data-scope="global">Global</button>
        </div>
        <div class="top-actions">
          <button id="selectProject" class="project-button" type="button" title="Select project folder" aria-label="Select project folder">
            <span>DIR</span>
            <small>Project</small>
          </button>
          <button id="detectPrimitives" class="icon-button" type="button" title="Scan selected folder for primitives" aria-label="Scan selected folder for primitives">SC</button>
          <button id="copyManifest" class="icon-button" type="button" title="Copy primitive manifest" aria-label="Copy primitive manifest">CP</button>
          <button id="resetTree" class="icon-button danger" type="button" title="Reset primitives" aria-label="Reset primitives">RS</button>
        </div>
      </header>

      <main class="main-grid">
        <section class="tree-panel" aria-label="Primitive tree">
          <div id="typeTabs" class="primitive-tabs" role="tablist" aria-label="Primitive type filter"></div>
          <div id="groupRail" class="group-rail"></div>
          <div class="zoom-bar" aria-label="Tree zoom controls">
            <button id="zoomOut" class="zoom-button" type="button" aria-label="Zoom out">-</button>
            <input id="zoomRange" type="range" min="55" max="140" value="100" aria-label="Tree zoom">
            <button id="zoomIn" class="zoom-button" type="button" aria-label="Zoom in">+</button>
            <button id="zoomFit" class="zoom-button wide" type="button">Fit</button>
            <button id="zoomReset" class="zoom-button wide" type="button">100%</button>
            <span id="zoomValue" class="zoom-value">100%</span>
          </div>
          <div class="tree-viewport">
            <div id="treeSpace" class="tree-scale-space">
              <div id="treeStage" class="tree-stage">
                <svg id="linkLayer" class="link-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                <div id="treeMap" class="tree-map"></div>
              </div>
            </div>
          </div>
        </section>

        <aside class="inspector" aria-label="Primitive details">
          <div class="inspector-top">
            <div id="selectedIcon" class="detail-icon">CX</div>
            <div>
              <div id="selectedState" class="state-pill">Ready</div>
              <h2 id="selectedTitle">Select a primitive</h2>
            </div>
          </div>
          <p id="selectedSummary" class="summary"></p>
          <div id="selectedPath" class="primitive-path"></div>
          <div id="selectedMeta" class="meta-row" aria-label="Primitive metadata"></div>
          <div class="detail-block">
            <h3>Provides</h3>
            <div id="providesList" class="chip-list"></div>
          </div>
          <div class="detail-block">
            <h3>Requires</h3>
            <div id="requiresList" class="chip-list"></div>
          </div>
          <div class="detail-block">
            <h3>Recommends</h3>
            <div id="recommendsList" class="chip-list"></div>
          </div>
          <div id="providerSelectionBlock" class="detail-block provider-selection-block" hidden>
            <h3>Provider Routing</h3>
            <div id="providerChoices" class="provider-choices"></div>
          </div>
          <button id="togglePrimitive" class="primary-action" type="button">Enable Primitive</button>

          <div class="detail-block detector-block">
            <div class="detail-heading">
              <h3>Detected Primitives</h3>
              <span id="detectedState">select folder</span>
            </div>
            <div id="detectedList" class="detected-list"></div>
          </div>

          <div class="markdown-panel">
            <div class="panel-heading">
              <h3 id="markdownTitle">Markdown Explorer</h3>
              <span id="markdownState">idle</span>
            </div>
            <div id="markdownBody" class="markdown-body"></div>
          </div>

          <div class="manifest-panel">
            <div class="panel-heading">
              <h3>Primitive Manifest</h3>
              <span id="manifestState">local</span>
            </div>
            <pre id="manifestPreview"></pre>
          </div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
